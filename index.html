<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Banco Imobiliário">
<meta name="theme-color" content="#efc000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Super Banco Imobiliário — Máquina Digital v4</title>
<style>
:root{--y:#efc000;--dark:#181818;--screen:#132015;--lime:#c9ff82;--green:#20a967;--red:#d83c3c;--blue:#5b7fd4}
*{box-sizing:border-box}body{margin:0;background:#111;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;background:#ededed;padding:9px 9px 30px}
.machine{background:var(--y);border-radius:28px;padding:13px;box-shadow:0 12px 35px #0009}
.logo{text-align:center;font-size:18px;font-weight:950;margin:1px 0 8px}
.screen{background:var(--screen);color:var(--lime);border-radius:13px;padding:10px;min-height:87px;text-align:center;font-family:ui-monospace,monospace;box-shadow:inset 0 0 12px #000}
.screen .state{font-size:11px;color:#d9e8c8}.screen .amount{font-size:31px;font-weight:900;margin-top:3px}
.ports{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.port{background:#dcdcdc;border:4px solid #888;border-radius:13px;min-height:79px;padding:8px;text-align:center}.port.left{border-color:var(--green)}.port.right{border-color:var(--red)}
.port .label{font-size:10px;font-weight:950}.port .name{font-weight:900;margin:3px 0}.port .bal{font-size:18px;font-weight:950}
.port button{margin-top:3px;padding:5px 8px;background:#fff;border:0;border-radius:7px;font-size:11px;font-weight:900}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.key{height:53px;border:0;border-radius:10px;background:#fff;font-size:21px;font-weight:900;box-shadow:0 2px 3px #0003}.key:active{transform:scale(.97)}
.blue{background:var(--blue);color:#fff}.red{background:var(--red);color:#fff}.green{background:var(--green);color:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.actions button{padding:12px;border:0;border-radius:10px;font-weight:950}
.yellow{background:#fff1a0}.dark{background:#222;color:#fff}.white{background:#fff}
.panel{background:#fff;border-radius:17px;padding:13px;margin-top:10px;box-shadow:0 2px 7px #0002}.panel h3{margin:0 0 8px;font-size:16px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:7px}.player{background:#fafafa;border:2px solid #ccc;border-radius:10px;padding:9px}.player.sel{border-color:#111}.player .n{font-weight:900}.player .b{font-size:19px;font-weight:950;margin-top:2px}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.row label{min-width:64px;font-weight:800}
select,input{width:100%;padding:9px;border:1px solid #bbb;border-radius:8px;background:#fff;font-size:15px}
.history{max-height:230px;overflow:auto}.hist{padding:7px 0;border-bottom:1px solid #eee;font-size:13px}
.hint{font-size:12px;color:#666;line-height:1.4}.winner{font-size:20px;font-weight:950;padding:7px 0}
.badge{display:inline-block;background:#eee;border-radius:7px;padding:3px 6px;font-size:10px;font-weight:900}

.insertHint{font<body>
<div class="app">
  <div class="machine">
    <div class="logo">SUPER BANCO IMOBILIÁRIO <span>• V4</span></div>
    <div class="screen">
      <div class="state" id="state">TOQUE EM LIGAR</div>
      <div class="amount" id="amount">R$ 0</div>
    </div>

    <div class="ports">
      <div class="port left" id="leftPort">
        <div class="label">ESQUERDA • CRÉDITO</div>
        <div class="name" id="ln">—</div><div class="bal" id="lb">—</div>
        <button onclick="removeLeft()">RETIRAR</button>
      </div>
      <div class="port right" id="rightPort">
        <div class="label">DIREITA • DÉBITO</div>
        <div class="name" id="rn">—</div><div class="bal" id="rb">—</div>
        <button onclick="removeRight()">RETIRAR</button>
      </div>
    </div>

    <div class="insertHint" id="insertHint">Selecione um jogador abaixo e toque em um lado para inserir o cartão.</div>

    <div class="keypad">
      <button class="key" onclick="digit('1')">1</button><button class="key" onclick="digit('2')">2</button><button class="key" onclick="digit('3')">3</button>
      <button class="key" onclick="digit('4')">4</button><button class="key" onclick="digit('5')">5</button><button class="key" onclick="digit('6')">6</button>
      <button class="key" onclick="digit('7')">7</button><button class="key" onclick="digit('8')">8</button><button class="key" onclick="digit('9')">9</button>
      <button class="key" onclick="digit('.')">.</button><button class="key" onclick="digit('0')">0</button><button class="key" onclick="backspace()">⌫</button>
      <button class="key blue" onclick="unit('K')">K</button><button class="key blue" onclick="unit('M')">M</button><button class="key red" onclick="clearInput()">C</button>
    </div>

    <div class="actions">
      <button class="yellow" onclick="yellow()">AMARELO • CONFIRMAR</button>
      <button class="green" onclick="startBonus()">🡆 INÍCIO + R$ 2.000</button>
    </div>
    <div class="actions">
      <button class="dark" id="powerBtn" onclick="greenStart()">VERDE • LIGAR</button>
      <button class="white" onclick="endGame()">AMARELO → VERMELHO</button>
    </div>
  </div>

  <div class="panel">
    <h3>Cartões — toque para selecionar</h3>
    <div class="players" id="players"></div>
    <div class="hint">Depois de selecionar um jogador, toque no lado esquerdo ou direito da máquina para inserir o cartão. Dois cartões inseridos fazem uma transferência.</div>
  </div>

  <div class="panel">
    <h3>Partida</h3>
    <div class="row"><label>Jogadores</label><select id="num" onchange="newGame()"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div>
    <div id="names"></div>
    <div class="actions"><button class="dark" onclick="resetBalances()">RESET SALDOS</button><button class="white" onclick="undo()">↩ DESFAZER</button></div>
    <div class="actions"><button class="white" onclick="newRound()">NOVA PARTIDA</button><button class="white" onclick="showSaved()">PARTIDAS SALVAS</button></div>
  </div>

  <div class="panel" id="savedPanel" style="display:none">
    <h3>Partidas salvas</h3>
    <div id="savedGames"></div>
  </div>

  <div class="panel">
    <h3>Resultado / Histórico</h3>
    <div id="result"></div><div class="history" id="history"></div>
  </div>
</div>

<script>
let players=[],L=null,R=null,input='',on=false,ended=false,history=[],undoStack=[],endStage=false;
let savedGames=JSON.parse(localStorage.getItem('bi_v4_games')||'[]');
const $=id=>document.getElementById(id);
const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:2});
function buzz(ms=15){if(navigator.vibrate)navigator.vibrate(ms)}
function beep(freq=520,dur=.045){
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.type='square';g.gain.value=.035;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur)}
  catch(e){}
}
function newGame(){
 const n=+$('num').value;players=Array.from({length:n},(_,i)=>({name:'Jogador '+(i+1),balance:25000}));
 L=R=null;input='';on=false;ended=false;endStage=false;history=[];undoStack=[];
 save();render();
 $('names').innerHTML=players.map((p,i)=>`<div class="row"><label>${i+1}</label><input value="${p.name}" oninput="players[${i}].name=this.value;save();render()"></div>`).join('');
}
function render(){
 $('state').textContent=!on?'MÁQUINA DESLIGADA':ended?'PARTIDA ENCERRADA':endStage?'PRESSIONE VERMELHO PARA FINALIZAR':(L!==null&&R!==null?'TRANSFERÊNCIA — DOIS CARTÕES':L!==null?'CRÉDITO — ESQUERDA':R!==null?'DÉBITO — DIREITA':'SELECIONE UM CARTÃO');
 $('amount').textContent=input?money(Number(input)):'R$ 0';
 $('ln').textContent=L===null?'—':players[L].name;$('lb').textContent=L===null?'—':money(players[L].balance);
 $('rn').textContent=R===null?'—':players[R].name;$('rb').textContent=R===null?'—':money(players[R].balance);
 $('players').innerHTML=players.map((p,i)=>`<div class="player ${(i===L||i===R)?'sel':''}" onclick="selectCard(${i})"><div class="n">${p.name}</div><div class="b">${money(p.balance)}</div><div class="badge">${i===L?'ESQ ':''}${i===R?'DIR':''}</div></div>`).join('');
 $('leftPort').classList.toggle('loaded',L!==null);$('rightPort').classList.toggle('loaded',R!==null);
 $('history').innerHTML=history.length?history.map(x=>`<div class="hist">${x}</div>`).join(''):'<div class="hint">Nenhuma operação.</div>';
}
function greenStart(){if(ended)return;on=true;beep(600);buzz(20);add('Máquina ligada');save();render()}
function selectCard(i){
 if(!on){greenStart()}
 if(L===i){R=null}
 else if(R===i){L=null}
 else if(L===null){L=i;beep(700);buzz(18)}
 else if(R===null){R=i;beep(760);buzz(18)}
 else {L=i}
 render()
}
function insertSide(side){
 if(!on){greenStart();return}
 const selected = [...document.querySelectorAll('.player.sel')].map(()=>null)
 // Prefer the last explicitly selected player, tracked by selectedPlayer.
 if(selectedPlayer===null){alert('Toque primeiro em um cartão de jogador.');return}
 if(side==='L'){
   if(R===selectedPlayer){alert('Esse cartão já está à direita.');return}
   L=selectedPlayer
 }else{
   if(L===selectedPlayer){alert('Esse cartão já está à esquerda.');return}
   R=selectedPlayer
 }
 beep(side==='L'?700:430);buzz(25);render()
}
let selectedPlayer=null;
function selectCard(i){
 selectedPlayer=i;
 if(!on){greenStart()}
 // If a side is free, insert immediately into the most useful free side.
 if(L===null) L=i;
 else if(R===null && i!==L) R=i;
 else if(i===L) L=null;
 else if(i===R) R=null;
 else L=i;
 beep(650);buzz(18);render()
}
function removeLeft(){L=null;beep(300);buzz(12);render()}
function removeRight(){R=null;beep(300);buzz(12);render()}
function digit(d){if(!on||ended)return;if(d==='.'&&input.includes('.'))return;input+=d;beep(520,.025);render()}
function backspace(){input=input.slice(0,-1);beep(360,.025);render()}
function clearInput(){input='';beep(300,.035);render()}
function unit(u){if(!input)return;const x=Number(input);if(!Number.isFinite(x))return;if(u==='K'){if(x>999){alert('K é usado para valores de 1 a 999.');return}}else input=String(x*1000);beep(740,.035);render()}
function snapshot(){undoStack.push(JSON.stringify(players));if(undoStack.length>30)undoStack.shift()}
function yellow(){
 if(!on||ended)return;
 if(endStage)return finishGame();
 const v=Number(input);if(!v)return alert('Digite o valor.');
 if(L===null&&R===null)return alert('Insira um cartão.');
 if(L!==null&&R!==null){
   if(L===R)return alert('Os cartões precisam ser diferentes.');
   snapshot();players[R].balance-=v;players[L].balance+=v;add(`${players[R].name} → ${players[L].name}: ${money(v)}`)
 }else if(L!==null){snapshot();players[L].balance+=v;add(`CRÉDITO ${money(v)} → ${players[L].name}`)}
 else {snapshot();players[R].balance-=v;add(`DÉBITO ${money(v)} ← ${players[R].name}`)}
 input='';beep(820,.06);buzz(35);save();render()
}
function startBonus(){if(!on||ended)return;if(L===null)return alert('Coloque um cartão à esquerda.');snapshot();players[L].balance+=2000;add(`INÍCIO + R$ 2.000 → ${players[L].name}`);input='';beep(900,.08);buzz(40);save();render()}
function endGame(){
 if(!on)return;
 if(!endStage&&!ended){endStage=true;input='';add('AMARELO — aguardando VERMELHO');beep(350);buzz(40);save();render();return}
 if(endStage&&!ended){finishGame()}
}
function finishGame(){
 ended=true;endStage=false;
 const max=Math.max(...players.map(p=>p.balance));const w=players.filter(p=>p.balance===max);
 $('result').innerHTML='<div class="winner">🏆 '+w.map(p=>p.name+' — '+money(p.balance)).join('<br>')+'</div>';
 add('PARTIDA ENCERRADA — vencedor(es): '+w.map(p=>p.name).join(', '));
 beep(980,.12);setTimeout(()=>beep(1200,.15),130);buzz(80);save();render()
}
function resetBalances(){if(!confirm('Resetar todos para R$ 25.000?'))return;snapshot();players.forEach(p=>p.balance=25000);ended=false;endStage=false;add('RESET — todos R$ 25.000');save();render()}
function undo(){if(!undoStack.length)return alert('Nada para desfazer.');players=JSON.parse(undoStack.pop());ended=false;endStage=false;add('Operação desfeita');save();render()}
function newRound(){saveGame('Partida '+new Date().toLocaleString('pt-BR'));newGame()}
function add(t){history.unshift(new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' — '+t);history=history.slice(0,100)}
function save(){localStorage.setItem('bi_v4_current',JSON.stringify({players,history}))}
function saveGame(name){
 savedGames.unshift({name,players:JSON.parse(JSON.stringify(players)),history:[...history],savedAt:new Date().toLocaleString('pt-BR')});
 savedGames=savedGames.slice(0,10);localStorage.setItem('bi_v4_games',JSON.stringify(savedGames))
}
function showSaved(){
 $('savedPanel').style.display='block';
 $('savedGames').innerHTML=savedGames.length?savedGames.map((g,i)=>`<div class="saved"><b>${g.name}</b><small>${g.savedAt}</small><button onclick="loadGame(${i})">ABRIR</button><button onclick="deleteGame(${i})">EXCLUIR</button></div>`).join(''):'<div class="hint">Nenhuma partida salva.</div>'
}
function loadGame(i){const g=savedGames[i];players=g.players;history=g.history||[];L=R=null;input='';on=true;ended=false;endStage=false;$('num').value=players.length;save();render();$('savedPanel').style.display='none'}
function deleteGame(i){savedGames.splice(i,1);localStorage.setItem('bi_v4_games',JSON.stringify(savedGames));showSaved()}
function load(){
 try{const x=JSON.parse(localStorage.getItem('bi_v4_current'));if(x?.players?.length){players=x.players;history=x.history||[];$('num').value=players.length;$('names').innerHTML=players.map((p,i)=>`<div class="row"><label>${i+1}</label><input value="${p.name}" oninput="players[${i}].name=this.value;save();render()"></div>`).join('');return true}}catch(e){}return false
}
if(!load())newGame();else render();
</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script></body>){players=x.players;history=x.history||[];$('num').value=players.length;$('names').innerHTML=players.map((p,i)=>`<div class="row"><label>${i+1}</label><input value="${p.name}" oninput="players[${i}].name=this.value;save();render()"></div>`).join('');return true}}catch(e){}return false}
if(!load())newGame();else render();
</script>
<script>if ("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script></body></html>
